name: Gerar versoes de teste (Android, Windows, Linux)

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Gerar APK de teste
        working-directory: App_Android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Music-Box-Android-TESTE
          path: App_Android/app/build/outputs/apk/debug/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar instalador Windows
        working-directory: App_PC
        run: |
          npm install
          npm run dist-win
      - uses: actions/upload-artifact@v4
        with:
          name: Music-Box-Windows-TESTE
          path: App_PC/instalador/*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar AppImage
        working-directory: App_PC
        run: |
          npm install
          npm run dist-linux
      - uses: actions/upload-artifact@v4
        with:
          name: Music-Box-Linux-TESTE
          path: App_PC/instalador/*.AppImage
