<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Music Box Teleprompter</title>
<style>
/* Fontes embutidas no app: funcionam sem internet (palco não tem Wi-Fi garantido) */
@font-face{font-family:'VT323';src:url('fonts/VT323-Regular.ttf') format('truetype');font-display:block;}
@font-face{font-family:'Share Tech Mono';src:url('fonts/ShareTechMono-Regular.ttf') format('truetype');font-display:block;}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:#0a0a00;color:#f5e642;font-family:'Share Tech Mono',monospace;width:100vw;height:100vh;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
input,textarea{user-select:text;-webkit-user-select:text;}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0,rgba(0,0,0,.15) 1px,transparent 1px,transparent 4px);pointer-events:none;z-index:99999;}
#wrapper{position:fixed;top:0;left:0;width:100vw;height:100vh;}
/* PC: monitor em pé no palco. O conteúdo gira 90° para um lado ou para o outro. */
#wrapper.giro90{width:100vh;height:100vw;top:0;left:100vw;transform-origin:top left;transform:rotate(90deg);}
#wrapper.giro270{width:100vh;height:100vw;top:100vh;left:0;transform-origin:top left;transform:rotate(-90deg);}
body.soltando #wrapper{outline:3px dashed #44ff88;outline-offset:-6px;}
#screen{width:100%;height:100%;display:flex;flex-direction:column;padding:2vh 2.5vw;gap:1.2vh;}
#logo{font-family:'VT323',monospace;font-size:clamp(22px,2.6vw,36px);color:#f5e642;letter-spacing:.1em;text-shadow:0 0 14px #f5e64288;border-bottom:1px solid #3a3800;padding-bottom:.7vh;flex-shrink:0;display:flex;justify-content:space-between;align-items:baseline;gap:1em;}
#logo.oculto{display:none;} #logo span{color:#ffcc00;}
#logo .ver{font-family:'Share Tech Mono',monospace;font-size:12px;color:#5a5210;letter-spacing:.04em;text-shadow:none;}
.content{flex:1;min-height:0;display:flex;flex-direction:column;gap:.8vh;overflow:hidden;}
.rolavel{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
.rolavel::-webkit-scrollbar{width:3px;} .rolavel::-webkit-scrollbar-thumb{background:#3a3800;}
.instrucao{font-size:13px;color:#7a7210;letter-spacing:.06em;margin-bottom:.5vh;flex-shrink:0;}
.pasta-titulo{font-size:26px;color:#7a7210;letter-spacing:.06em;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Itens de lista: alvo de toque grande (mín. 48px) */
.item{display:flex;align-items:center;min-height:48px;padding:.4em .8em;color:#7a7210;font-size:clamp(15px,1.9vw,24px);letter-spacing:.05em;border-left:3px solid transparent;border-bottom:1px solid #161600;cursor:pointer;}
.item .nome{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item .qtd{color:#4a4510;font-size:.8em;margin-left:.8em;flex-shrink:0;}
.item .mais{flex-shrink:0;width:48px;height:44px;margin:-.4em -.6em -.4em .4em;display:flex;align-items:center;justify-content:center;color:#7a7210;font-size:1.3em;border-left:1px solid #222200;}
.item:active{background:#1a1800;}
.item.selected{color:#f5e642;background:#2a2600;border-left:3px solid #f5e642;text-shadow:0 0 8px #f5e64255;}
.item.acao{color:#f5e642;}
.item.quebra .nome{white-space:normal;line-height:1.4;padding:.2em 0;}
.item-pasta{font-size:clamp(18px,2.6vw,28px);}
.vazio{color:#5a5210;padding:1em .8em;font-size:15px;line-height:1.6;}

.info-box{border:1px solid #3a3800;padding:.9vh 1.8vw;background:#111100;line-height:2.0;flex-shrink:0;font-size:clamp(13px,1.6vw,20px);}
.info-box .label{color:#7a7210;font-size:.8em;} .info-box .valor{color:#ffdd00;}
.info-box .ok{color:#44ff88;} .info-box .nao{color:#ff7766;}
.status-linha{font-size:12px;color:#7a7210;letter-spacing:.05em;flex-shrink:0;display:flex;flex-wrap:wrap;gap:.3em 1.4em;}
.status-linha .ok{color:#44ff88;} .status-linha .nao{color:#ff7766;} .status-linha .valor{color:#b8a83a;}

/* ── Leitura (igual ao FTSW1) ── */
.leitura-status{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:.5vw;padding:.5vh .8vw;background:#0d0d00;border:1px solid #3a3800;border-left:4px solid #8a760c;font-size:clamp(12px,1.1vw,16px);color:#b8a83a;line-height:1.2;}
.leitura-status .nome-musica{color:#f5e642;font-size:clamp(13px,1.2vw,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%;}
.leitura-status .info-dir{display:flex;align-items:center;gap:.8vw;flex-shrink:0;}
.pedal-badge{min-width:5.6em;text-align:center;font-size:clamp(12px,1.2vw,17px);padding:.15vh .45vw;border:1px solid #3b3b3b;border-radius:2px;color:#5c5c5c;}
.pedal-badge.ativo{color:#49bfff;border-color:#49bfff;text-shadow:0 0 7px #49bfff;box-shadow:0 0 8px #49bfff66;}
.play-badge{font-size:clamp(13px,1.3vw,18px);padding:.15vh .5vw;border:1px solid currentColor;border-radius:2px;transition:color .15s,border-color .15s;}
.play-badge.tocando{color:#44ff88;border-color:#44ff88;}
.play-badge.pausado{color:#666;border-color:#444;}
.play-badge.fim{color:#2196ff;border-color:#2196ff;}
.leitura-wrapper{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;}
.leitura-wrapper::before{content:'';position:absolute;left:0;right:0;top:42%;height:3.6em;background:linear-gradient(180deg,rgba(245,230,66,.06) 0%,rgba(245,230,66,.11) 20%,rgba(245,230,66,.11) 80%,rgba(245,230,66,.03) 100%);border-top:1px solid rgba(245,230,66,.28);border-bottom:1px solid rgba(245,230,66,.10);z-index:10;pointer-events:none;}
.leitura-wrapper::after{content:'';position:absolute;left:2%;right:2%;top:42%;height:1px;background:linear-gradient(90deg,transparent 0%,rgba(245,230,66,.50) 15%,rgba(245,230,66,.70) 50%,rgba(245,230,66,.50) 85%,transparent 100%);box-shadow:0 0 8px rgba(245,230,66,.22);z-index:11;pointer-events:none;}
.leitura-box{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;border-left:1px solid #3a3800;border-right:1px solid #3a3800;background:#080800;scroll-behavior:auto;-webkit-overflow-scrolling:touch;}
.leitura-box::-webkit-scrollbar{width:3px;} .leitura-box::-webkit-scrollbar-thumb{background:#3a3800;}
.pagina-texto{font-size:clamp(13px,1.5vw,23px);line-height:1.75;text-shadow:0 0 4px #f5e64222;padding:0 .8vw 2vh .8vw;}
.linha-texto{min-height:1.75em;white-space:pre-wrap;word-break:normal;}
.ln-letra{color:#f5e642;} .ln-cifra{color:#fff;text-shadow:0 0 6px #ffffff44;} .ln-marcador{color:#ff9f1c;letter-spacing:.08em;font-size:.85em;}
.linha-texto.ln-final{color:#2196ff;text-shadow:0 0 8px #2196ffaa;}
.paginador{font-size:clamp(12px,1.05vw,16px);color:#b8a83a;text-align:right;border-top:1px solid #3a3800;padding-top:.3vh;flex-shrink:0;}

/* ── Rodapé: no FTSW1 eram dicas do pedal; aqui são botões de toque ── */
.footer{display:flex;flex-wrap:nowrap;gap:6px;border-top:1px solid #3a3800;padding-top:.7vh;flex-shrink:0;align-items:stretch;}
.footer.fino{padding-top:.25vh;gap:5px;}
.footer.fino .btn{min-height:32px;padding:.12em .6em;line-height:1.1;font-size:clamp(13px,1.3vw,17px);}
.btn{flex:1 1 auto;min-height:44px;padding:.4em .9em;background:#111100;color:#f5e642;border:1px solid #3a3800;font-family:'Share Tech Mono',monospace;font-size:clamp(14px,1.5vw,19px);letter-spacing:.04em;cursor:pointer;white-space:normal;line-height:1.2;min-width:0;}
.btn:active{background:#2a2600;border-color:#f5e642;}
.btn.perigo{color:#ff7766;border-color:#5a2020;}
.btn.ligado{color:#44ff88;border-color:#44ff88;}
.btn.fraco{color:#7a7210;}
.btn.contador{display:flex;align-items:center;justify-content:center;color:#b8a83a;cursor:default;flex:0 0 auto;text-align:center;}
.btn.contador:active{background:#111100;border-color:#3a3800;}
.ajuda p{color:#b8a83a;font-size:15px;line-height:1.6;margin:0 .8em .9em .8em;}
.ajuda h4{font-family:'VT323',monospace;font-weight:normal;font-size:22px;color:#f5e642;letter-spacing:.06em;margin:.8em .6em .3em .6em;}
.vel{display:flex;flex:1 1 auto;min-height:44px;border:1px solid #3a3800;background:#111100;}
.vel .btn{border:none;flex:0 0 48px;padding:0;font-size:20px;}
.vel .val{flex:1;display:flex;align-items:center;justify-content:center;color:#b8a83a;font-size:clamp(13px,1.4vw,18px);white-space:nowrap;padding:0 .3em;}
.dica{font-size:12px;color:#5a5210;line-height:1.5;flex-shrink:0;}
.key{color:#f5e642;}
.blink{animation:blink 1s step-end infinite;} @keyframes blink{50%{opacity:0;}}

/* ── Editor ── */
.campo{width:100%;background:#111100;color:#f5e642;border:1px solid #3a3800;padding:.6em;font-family:'Share Tech Mono',monospace;font-size:16px;outline:none;}
.campo:focus{border-color:#f5e642;}
textarea.campo{flex:1;min-height:0;resize:none;line-height:1.5;white-space:pre;overflow:auto;}

/* ── Janelas (modais) ── */
#modal{position:absolute;inset:0;background:rgba(0,0,0,.78);z-index:5000;display:none;align-items:center;justify-content:center;padding:4vh 4vw;}
#modal.aberto{display:flex;}
.janela{width:100%;max-width:560px;max-height:100%;display:flex;flex-direction:column;gap:10px;background:#0d0d00;border:1px solid #f5e642;box-shadow:0 0 24px #f5e64233;padding:14px;}
.janela h3{font-family:'VT323',monospace;font-weight:normal;font-size:24px;letter-spacing:.08em;color:#f5e642;}
.janela p{color:#b8a83a;font-size:15px;line-height:1.5;}
.janela .lista{overflow-y:auto;min-height:0;border:1px solid #222200;max-height:45vh;}
.janela .botoes{display:flex;gap:8px;flex-wrap:wrap;}
.marca{display:flex;align-items:center;gap:10px;color:#b8a83a;font-size:14px;cursor:pointer;}
.marca input{width:20px;height:20px;accent-color:#f5e642;}
#toast{position:absolute;left:50%;bottom:12vh;transform:translateX(-50%);background:#2a2600;color:#f5e642;border:1px solid #f5e642;padding:10px 18px;font-size:15px;z-index:6000;display:none;max-width:90%;text-align:center;}

@media(max-width:700px){
  #screen{padding:1.2vh 2.2vw;gap:.8vh;}
  .pagina-texto{font-size:clamp(15px,3.6vw,22px);line-height:1.65;}
  .linha-texto{min-height:1.65em;}
  .leitura-status{font-size:clamp(12px,3vw,16px);}
  .btn{padding:.35em .45em;font-size:clamp(12px,3.3vw,16px);}
  .footer{gap:5px;}
  .footer.fino .btn{min-height:32px;padding:.12em .4em;font-size:clamp(12px,3.1vw,15px);}
  .pasta-titulo,.item-pasta{font-size:20px;}
}
</style></head>
<body>
<div id="wrapper"><div id="screen">
  <div id="logo"><div>&#9654; <span>MUSIC BOX</span> TELEPROMPTER</div><div class="ver" id="versao"></div></div>
  <div class="content" id="content"><div class="instrucao blink">carregando...</div></div>
  <div class="footer" id="footer"></div>
</div>
<div id="modal"></div>
<div id="toast"></div>
</div>
<script>
// Se algo der errado, mostra o erro na tela em vez de ficar em "carregando..."
window.onerror = function (msg, arq, linha) {
  var c = document.getElementById('content');
  if (c) c.innerHTML = "<div class='instrucao' style='color:#ff7766;line-height:1.6'>ERRO NA TELA: " +
    String(msg).replace(/</g, '&lt;') + " (linha " + linha + ")<br>Tire um print e mande para o suporte.</div>";
};
</script>
<script>
'use strict';
var VERSAO = 'APP 1.0';

// ═══════════════════════════════════════════════════════════
//  PONTE COM O ANDROID
//  No celular, o app Java expõe window.Android. Aberto num navegador
//  de PC (para testar a interface), usa uma simulação em memória.
// ═══════════════════════════════════════════════════════════
function J(s, def) { try { var v = JSON.parse(s); return v === null ? def : v; } catch (e) { return def; } }
var temAndroid = typeof window.Android !== 'undefined';
var B = temAndroid ? ponteAndroid() : ponteSimulada();

function ponteAndroid() {
  var A = window.Android;
  // Chama uma função do Android só se ela existir (APK antigo não trava a tela)
  function tem(f) { return typeof A[f] === 'function'; }
  return {
    estado: function () { return J(A.estado(), {}); },
    pastas: function () { return J(A.pastas(), []); },
    musicas: function (p) { return J(A.musicas(p), []); },
    ler: function (p, a) { return A.ler(p, a) || ''; },
    salvarMusica: function (p, orig, novo, txt) { return J(A.salvarMusica(p, orig, novo, txt), { ok: false }); },
    novaPasta: function (n) { return J(A.novaPasta(n), { ok: false }); },
    renomearPasta: function (a, b) { return J(A.renomearPasta(a, b), { ok: false }); },
    apagarPasta: function (a) { return J(A.apagarPasta(a), { ok: false }); },
    renomearMusica: function (p, a, b) { return J(A.renomearMusica(p, a, b), { ok: false }); },
    apagarMusica: function (p, a) { return J(A.apagarMusica(p, a), { ok: false }); },
    moverMusica: function (p, a, d) { return J(A.moverMusica(p, a, d), { ok: false }); },
    importacao: function () { return J(A.importacao(), { itens: [] }); },
    concluirImportacao: function (p, nomes, subst) { return J(A.concluirImportacao(p, JSON.stringify(nomes), !!subst), { ok: false }); },
    descartarImportacao: function () { A.descartarImportacao(); },
    abrirSeletor: function () { A.abrirSeletor(); },
    pedirPastaVisivel: function () { A.pedirPastaVisivel(); },
    restaurarAmostras: function () { return J(A.restaurarAmostras(), { ok: false }); },
    getPref: function (k, d) { var v = A.getPref(k); return (v === null || v === undefined || v === '') ? d : v; },
    setPref: function (k, v) { A.setPref(k, String(v)); },
    teclado: function () { if (tem('teclado')) A.teclado(); },
    setLeitura: function (b) { if (tem('setLeitura')) A.setLeitura(!!b); },
    setPaisagem: function (b) { if (tem('setPaisagem')) A.setPaisagem(!!b); },
    sair: function () { A.sair(); },
    // Só na versão para PC (no Android estas funções não existem e nada acontece)
    abrirPastaMusicas: function () { if (tem('abrirPastaMusicas')) A.abrirPastaMusicas(); },
    telaCheia: function () { if (tem('telaCheia')) A.telaCheia(); }
  };
}

function ponteSimulada() {
  // Só para pré-visualizar no navegador do PC. Nada disso vai para o celular.
  var fs = {
    'AMOSTRAS': {
      '00 - Como usar o Music Box.txt': '[COMO USAR]\nPise no pedal: a letra desce.\nSolte o pedal: a letra para.\nCom o dedo voce sobe ou desce quando quiser.\n\n[PREVIA NO PC]\nAqui no navegador, a tecla PAGE DOWN\nfaz o papel do pedal.',
      '01 - Exemplo de Cifra.txt': '[INTRO]\nG  D/F#  Em  C\n\n[VERSO]\nG              D/F#\nLinha de exemplo para testar\nEm             C\nA cifra fica branca, a letra amarela\n\n[REFRAO]\nC        D        G\nE o marcador fica laranja'
    },
    'MINHA_PLAYLIST': {}
  };
  var prefs = {};
  try { var s = localStorage.getItem('mb_sim'); if (s) { var o = JSON.parse(s); fs = o.fs || fs; prefs = o.prefs || {}; } } catch (e) {}
  function gravar() { try { localStorage.setItem('mb_sim', JSON.stringify({ fs: fs, prefs: prefs })); } catch (e) {} }
  function txt(n) { n = String(n || '').replace(/[\\\/:*?"<>|]/g, '').trim(); if (!n) n = 'Musica'; if (!/\.txt$/i.test(n)) n += '.txt'; return n.replace(/\.txt$/i, '.txt'); }
  function pst(n) { n = String(n || '').replace(/[\\\/:*?"<>|.]/g, '').trim().replace(/\s+/g, '_').toUpperCase(); return n || 'MINHA_PASTA'; }
  return {
    estado: function () { return { visivel: false, podeVisivel: true, raiz: '(simulação no navegador)', pedal: false, simulado: true }; },
    pastas: function () { return Object.keys(fs).sort().map(function (p) { return { nome: p, qtd: Object.keys(fs[p]).length }; }); },
    musicas: function (p) { return fs[p] ? Object.keys(fs[p]).sort() : []; },
    ler: function (p, a) { return (fs[p] && fs[p][a]) || ''; },
    salvarMusica: function (p, orig, novo, t) {
      var n = txt(novo); if (!fs[p]) return { ok: false, erro: 'Pasta não existe' };
      if (n !== orig && fs[p][n] !== undefined) return { ok: false, erro: 'Já existe uma música com esse nome' };
      if (orig && orig !== n) delete fs[p][orig]; fs[p][n] = t; gravar(); return { ok: true, arq: n };
    },
    novaPasta: function (n) { n = pst(n); if (fs[n]) return { ok: false, erro: 'Essa pasta já existe' }; fs[n] = {}; gravar(); return { ok: true, nome: n }; },
    renomearPasta: function (a, b) { b = pst(b); if (fs[b]) return { ok: false, erro: 'Essa pasta já existe' }; fs[b] = fs[a]; delete fs[a]; gravar(); return { ok: true, nome: b }; },
    apagarPasta: function (a) { delete fs[a]; gravar(); return { ok: true }; },
    renomearMusica: function (p, a, b) { b = txt(b); if (fs[p][b] !== undefined) return { ok: false, erro: 'Já existe uma música com esse nome' }; fs[p][b] = fs[p][a]; delete fs[p][a]; gravar(); return { ok: true, arq: b }; },
    apagarMusica: function (p, a) { delete fs[p][a]; gravar(); return { ok: true }; },
    moverMusica: function (p, a, d) { if (fs[d][a] !== undefined) return { ok: false, erro: 'Já existe uma música com esse nome lá' }; fs[d][a] = fs[p][a]; delete fs[p][a]; gravar(); return { ok: true }; },
    importacao: function () { return { itens: [] }; },
    concluirImportacao: function () { return { ok: true, qtd: 0 }; },
    descartarImportacao: function () {},
    abrirSeletor: function () { toast('No celular, isto abre o seletor de arquivos.'); },
    pedirPastaVisivel: function () { toast('No celular, isto pede a permissão da pasta.'); },
    restaurarAmostras: function () { return { ok: true, qtd: 0 }; },
    getPref: function (k, d) { return prefs[k] === undefined ? d : prefs[k]; },
    setPref: function (k, v) { prefs[k] = String(v); gravar(); },
    teclado: function () {}, setLeitura: function () {}, setPaisagem: function () {}, sair: function () { toast('No celular, o app fecharia aqui.'); }
  };
}

// ═══════════════════════════════════════════════════════════
//  ESTADO
// ═══════════════════════════════════════════════════════════
var wrapper = document.getElementById('wrapper'),
  logo = document.getElementById('logo'),
  content = document.getElementById('content'),
  footer = document.getElementById('footer'),
  modalEl = document.getElementById('modal'),
  toastEl = document.getElementById('toast');
document.getElementById('versao').textContent = VERSAO;

var tela = 'pastas';
var pastaAtual = '';
var listaMusicas = [];
var idxMusica = -1;
var espelharTV = B.getPref('tv', '0') === '1';  // trava a tela deitada para espelhar na Smart TV
var velocidade = parseInt(B.getPref('vel', '70'), 10) || 70;
var modoPedal = B.getPref('modoPedal', 'segurar'); // 'segurar' ou 'alternar'
var pedalPressionado = false;
var editorOrig = '';

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function nomePasta(n) { return String(n).replace(/_/g, ' '); }
function nomeMusica(n) { return String(n).replace(/\.txt$/i, ''); }

var toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.style.display = 'block';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.style.display = 'none'; }, 2200);
}

// A orientação é do próprio Android: girou o aparelho, a tela gira junto.
// Só no modo "espelhar na Smart TV" a tela fica travada deitada.
B.setPaisagem(espelharTV);

// ── Só no PC: tela em pé (monitor girado no palco) ──
var ehPC = !!B.estado().pc;
var giro = ehPC ? B.getPref('giro', '0') : '0';   // '0' normal, '90' ou '270'
function aplicarGiro() {
  wrapper.classList.toggle('giro90', giro === '90');
  wrapper.classList.toggle('giro270', giro === '270');
  if (leituraAtiva) setTimeout(function () { prepararLayoutLeitura(); atualizarProgresso(true); }, 60);
}
function trocarGiro() {
  if (!ehPC) return;
  giro = giro === '0' ? '90' : giro === '90' ? '270' : '0';
  B.setPref('giro', giro);
  aplicarGiro();
  toast(giro === '0' ? 'Tela normal' : 'Tela em pé (' + giro + '°)');
  if (tela === 'config') renderConfig();
}

// Delegação de toques: qualquer elemento com data-a="acao" e data-v="valor"
var acoes = {};
function ligarAcoes(raiz) {
  raiz.onclick = function (ev) {
    var el = ev.target;

// ═══════════════════════════════════════════════════════════
//  CLASSIFICAÇÃO DE LINHAS (porta fiel do 10_filesystem.h)
// ═══════════════════════════════════════════════════════════
function ehAcorde(p) {
  if (!p.length) return false;
  var c0 = p.charAt(0);
  if (c0 < 'A' || c0 > 'G') return false;
  var aposSlash = false;
  for (var i = 1; i < p.length; i++) {
    var c = p.charAt(i);
    if (c === '/') { aposSlash = true; continue; }
    if (aposSlash && c >= 'A' && c <= 'G') { aposSlash = false; continue; }
    aposSlash = false;
    var ok = (c >= '0' && c <= '9') || (c >= 'a' && c <= 'z') || c === '#' || c === 'b' || c === '+' ||
      c === '-' || c === '(' || c === ')' || c === 'M';
    if (!ok) return false;
  }
  if (p.length > 8) return false;
  return true;
}
function classificarLinha(linha) {
  var t = linha.trim();
  if (t.charAt(0) === '[') return 'M';
  if (!t.length) return 'L';
  var palavras = t.split(/[ \t]+/), total = 0, acordes = 0;
  for (var i = 0; i < palavras.length; i++) {
    if (!palavras[i]) continue;
    total++;
    if (ehAcorde(palavras[i])) acordes++;
  }
  if (!total) return 'L';
  return (acordes * 10 >= total * 6) ? 'C' : 'L';
}
function carregarLinhas(texto) {
  var brutas = String(texto).replace(/^﻿/, '').split('\n');
  var out = [];
  for (var i = 0; i < brutas.length; i++) {
    var l = brutas[i];
    if (l.charAt(l.length - 1) === '\r') l = l.substring(0, l.length - 1);
    var tipo = classificarLinha(l);
    if (tipo !== 'C') l = l.trim();     // cifra preserva os espaços (posição dos acordes)
    out.push({ t: l, k: tipo });
  }
  if (!out.length || (out.length === 1 && !out[0].t)) out = [{ t: '(arquivo vazio)', k: 'L' }];
  return out;
}

    "<span class='info-dir'><span class='play-badge pausado' id='playBadge'>&#9208; PARADO</span></span></div>" +
    "<div class='leitura-wrapper' id='leituraWrapper'><div class='leitura-box' id='leituraBox'><div class='pagina-texto' id='paginaTexto'>" + html + "</div></div></div>" +
    "<div class='paginador' id='paginador'>LINHA 1 / " + linhas.length + " &nbsp;|&nbsp; 0%</div>";
  renderFooterLeitura();
  leituraBox = document.getElementById('leituraBox');
  statusEl = document.getElementById('leituraStatus');
  paginadorEl = document.getElementById('paginador');
  totalLinhas = linhas.length;
  leituraAtiva = true;
  // Dedo na tela: o motor "solta" a rolagem para o dedo e retoma quando ele sai.
  leituraBox.addEventListener('touchstart', function () { dedoNaTela = true; }, { passive: true });
  leituraBox.addEventListener('touchend', function () { dedoNaTela = false; motorPrevTs = null; }, { passive: true });
  leituraBox.addEventListener('touchcancel', function () { dedoNaTela = false; motorPrevTs = null; }, { passive: true });
  leituraBox.addEventListener('scroll', function () { if (!motorRolando) atualizarProgresso(); }, { passive: true });
  atualizarPedalBadge();
  requestAnimationFrame(function () {
    prepararLayoutLeitura();
    leituraBox.scrollTop = 0;
    atualizarBadges();
    atualizarProgresso(true);
  });
}
function renderFooterLeitura() {
  footer.className = 'footer fino'; footer.innerHTML = "<button class='btn' data-a='irLista'>&#9664; LISTA</button>" +
    "<button class='btn' data-a='topo'>&#8679; IN&Iacute;CIO</button>" +
    "<button class='btn' data-a='proxima'>PR&Oacute;XIMA &#9654;</button>";
}
function prepararLayoutLeitura() {
  var wr = document.getElementById('leituraWrapper');
  faixaOffsetY = wr ? Math.round(wr.clientHeight * 0.42) : 0;
  var pt = document.getElementById('paginaTexto');
  if (pt) pt.style.paddingTop = faixaOffsetY + 'px';
  ajustarFonteLeitura();
  recalcularScrollMax();
}
acoes.irLista = function () { renderMusicas(); };
acoes.topo = function () { motorParar(); if (leituraBox) { leituraBox.scrollTop = 0; atualizarProgresso(true); } };
acoes.proxima = function () { abrirMusica(idxMusica + 1); };
acoes.vel = function (v) {
  mudarVelocidade(parseInt(v, 10));
  var el = document.getElementById('velVal'); if (el) el.textContent = 'VEL ' + velocidade;
};
acoes.auto = function () { if (motorRolando) motorParar(); else iniciarRolagem(1); };

function noFim() { return !!leituraBox && motorScrollMax > 0 && leituraBox.scrollTop >= motorScrollMax - 1; }
function iniciarRolagem(dir) {
  if (!leituraAtiva) return;
  recalcularScrollMax();
  if (dir > 0 && (motorScrollMax <= 0 || noFim())) { atualizarBadges(motorScrollMax > 0); return; }
  if (dir < 0 && leituraBox.scrollTop <= 0) return;
  motorIniciar(velocidade, dir);
}

function recalcularScrollMax() {
  if (!leituraBox) { motorScrollMax = 0; return; }
  leituraAlturaTotal = leituraBox.scrollHeight;
  leituraAlturaVisivel = leituraBox.clientHeight;
  var ultima = leituraBox.querySelector('.linha-texto:last-child');
  motorScrollMax = ultima
    ? Math.max(0, ultima.offsetTop - leituraAlturaVisivel + ultima.offsetHeight)
    : Math.max(0, leituraAlturaTotal - leituraAlturaVisivel);
}

function limitesFonteLeitura() {
  // A MAIOR LINHA DO TXT manda: a fonte encolhe até ela caber inteira.
  // Mínimo 8 em qualquer tela (em pé, deitado, tablet, TV) para nunca
  // quebrar linha — linha quebrada desalinha a cifra em cima da letra.
  return { min: 8, max: 36 };
}
// A linha mais larga (letra, cifra ou marcador) define um único tamanho de
// fonte para a música inteira, com 4% de folga — igual ao FTSW1.
function ajustarFonteLeitura() {
  var pagina = document.getElementById('paginaTexto');
  if (!pagina || !leituraBox) return;
  var linhas = pagina.querySelectorAll('.linha-texto');
  if (!linhas.length) return;
  var lim = limitesFonteLeitura();
  pagina.style.fontSize = lim.max + 'px';
  var est = window.getComputedStyle(pagina);
  var util = pagina.clientWidth - (parseFloat(est.paddingLeft) || 0) - (parseFloat(est.paddingRight) || 0);
  if (util <= 0) return;
  var segura = util * 0.96;
  var med = document.createElement('span');
  med.style.cssText = 'position:fixed;left:-100000px;top:0;visibility:hidden;white-space:pre;';
  document.body.appendChild(med);
  var maior = 0;
  for (var i = 0; i < linhas.length; i++) {
    var texto = (linhas[i].textContent || '').replace(/[\s ]+$/, '');
    if (!texto) continue;
    var e = window.getComputedStyle(linhas[i]);
    med.style.fontFamily = e.fontFamily; med.style.fontSize = e.fontSize;
    med.style.letterSpacing = e.letterSpacing; med.style.fontWeight = e.fontWeight;
    med.textContent = texto;
    var l = med.getBoundingClientRect().width;
    if (l > maior) maior = l;
  }
  document.body.removeChild(med);
  var tam = lim.max;
  if (maior > segura) tam = Math.floor(lim.max * segura / maior * 10) / 10;
  tam = Math.max(lim.min, Math.min(lim.max, tam));
  // ESPELHAR NA SMART TV: a tela deitada é baixa e a letra ficava enorme,
  // com só 1 linha e meia à vista. Aqui a altura também manda: a fonte
  // diminui até caberem LINHAS_ABAIXO_DA_FAIXA linhas depois da faixa de
  // leitura (o que o músico vê chegando para se localizar).
  if (espelharTV && leituraBox.clientHeight > 0) {
    var LINHAS_ABAIXO_DA_FAIXA = 6;
    pagina.style.fontSize = tam + 'px';
    var alturaLinha = parseFloat(window.getComputedStyle(pagina).lineHeight) || tam * 1.75;
    var fatorLinha = alturaLinha / tam;
    var alturaAbaixo = leituraBox.clientHeight * (1 - 0.42);
    var tamAltura = Math.floor(alturaAbaixo / (LINHAS_ABAIXO_DA_FAIXA * fatorLinha) * 10) / 10;
    if (tamAltura < tam) tam = Math.max(lim.min, tamAltura);
  }
  pagina.style.fontSize = tam + 'px';
}

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function () { if (leituraAtiva) { ajustarFonteLeitura(); recalcularScrollMax(); } });
}
window.addEventListener('resize', function () {
  if (fonteResizeTimer) clearTimeout(fonteResizeTimer);
  fonteResizeTimer = setTimeout(function () {
    fonteResizeTimer = null;

  }, 150);
});

// ── Motor de rolagem (mesma lógica do FTSW1: sessão única + acumulador) ──
var motorRolando = false, motorVelPx = velocidade, motorDir = 1, motorPrevTs = null;
var motorSessao = 0, motorAcum = 0, motorUltimoRecalc = 0;

function motorTick() {
  if (!motorRolando || !leituraBox) return;
  var now = performance.now();
  if (dedoNaTela) { motorPrevTs = now; motorAcum = 0; return; }   // o dedo manda
  var dt = motorPrevTs === null ? 0 : Math.min(now - motorPrevTs, 100);
  motorPrevTs = now;
  if (now - motorUltimoRecalc > 2000) { motorUltimoRecalc = now; recalcularScrollMax(); }
  motorAcum += motorVelPx * dt / 1000 * motorDir;
  var inteiro = motorDir > 0 ? Math.floor(motorAcum) : Math.ceil(motorAcum);
  if (inteiro === 0) return;
  motorAcum -= inteiro;
  var novo = leituraBox.scrollTop + inteiro;
  if (motorDir > 0 && novo >= motorScrollMax) {
    leituraBox.scrollTop = motorScrollMax; atualizarProgresso(true); motorParar(); atualizarBadges(true); return;
  }
  if (motorDir < 0 && novo <= 0) {
    leituraBox.scrollTop = 0; atualizarProgresso(true); motorParar(); return;
  }
  leituraBox.scrollTop = novo;
  atualizarProgresso();
}
function motorFrame(sessao) {
  if (sessao !== motorSessao || !motorRolando || !leituraBox) return;
  motorTick();
  requestAnimationFrame(function () { motorFrame(sessao); });
}
function motorIniciar(vel, dir) {
  if (motorRolando && motorDir === dir) { motorVelPx = vel; return; }   // idempotente
  motorSessao++;
  var s = motorSessao;
  motorVelPx = vel; motorDir = dir; motorRolando = true; motorPrevTs = null; motorAcum = 0;
  requestAnimationFrame(function () { motorFrame(s); });
  atualizarBadges();
}
function motorParar() {
  motorSessao++;
  motorRolando = false; motorPrevTs = null; motorAcum = 0;
  atualizarBadges();
}
function atualizarBadges(fim) {
  var pb = document.getElementById('playBadge');
  if (pb) {
    if (!motorRolando && (fim || noFim())) { pb.textContent = '■ FIM'; pb.className = 'play-badge fim'; }
    else {
      pb.textContent = motorRolando ? (motorDir < 0 ? '▲ SUBINDO' : '▼ ROLANDO') : '⏸ PARADO';
      pb.className = 'play-badge ' + (motorRolando ? 'tocando' : 'pausado');
    }
  }
  var ba = document.getElementById('btnAuto');
  if (ba) { ba.innerHTML = motorRolando ? '&#9208; PARAR' : '&#9654; ROLAR'; ba.className = 'btn' + (motorRolando ? ' ligado' : ''); }
}
var progUltimo = 0;
function atualizarProgresso(forcar) {
  if (!leituraBox || !paginadorEl || !totalLinhas) return;
  var now = performance.now();
  if (!forcar && now - progUltimo < 200) return;
  progUltimo = now;
  var st = leituraBox.scrollTop;
  var max = leituraAlturaTotal - leituraAlturaVisivel;
  var pct = max > 0 ? Math.round(st / max * 100) : 0;
  pct = Math.max(0, Math.min(100, pct));
  var util = Math.max(0, st - faixaOffsetY);
  var alt = leituraAlturaTotal - faixaOffsetY - leituraAlturaVisivel;
  var linha = alt > 0 ? Math.min(totalLinhas, Math.round(util / alt * totalLinhas) + 1) : 1;
  paginadorEl.textContent = 'LINHA ' + linha + ' / ' + totalLinhas + '  |  ' + pct + '%';
  if (!motorRolando) atualizarBadges();
}

var MB = window.MB = {};
MB.pedal = function (acao, dir) {
  dir = dir < 0 ? -1 : 1;
  pedalPressionado = acao === 'down';
  atualizarPedalBadge();
  var t = document.getElementById('testePedal');
  if (t) { t.textContent = pedalPressionado ? (dir > 0 ? 'PRESSIONADO ▼' : 'PRESSIONADO ▲') : 'SOLTO'; t.classList.toggle('ativo', pedalPressionado); }
  if (tela !== 'leitura') return;
  if (modoPedal === 'segurar') {
    if (pedalPressionado) iniciarRolagem(dir);
    else motorParar();
  } else if (pedalPressionado) {
    if (motorRolando) motorParar(); else iniciarRolagem(dir);
  }
};
function atualizarPedalBadge() {
  var b = document.getElementById('pedalBadge');
  if (!b) return;
  b.textContent = pedalPressionado ? 'PEDAL ▼' : 'PEDAL --';
  b.classList.toggle('ativo', pedalPressionado);
}
// Eventos vindos do Android
MB.evento = function (tipo) {
  if (tipo === 'importacao') { mostrarImportacao(); return; }
  if (tipo === 'giro') { trocarGiro(); return; }
  if (tipo === 'armazenamento' || tipo === 'pedal') {

    if (tipo === 'pedal') {

      if (!ep.pc) toast(ep.pedal ? (ep.pedalTipo === 'bt' ? 'Pedal Bluetooth' : 'Pedal via cabo') : 'Pedal não detectado');
    }

};

// Botão VOLTAR do Android. Retorna true se tratou; false = pode fechar o app.
window.voltar = function () {
  if (modalEl.classList.contains('aberto')) { fecharModal(); return true; }
  if (tela === 'leitura') { renderMusicas(); return true; }
  if (tela === 'editor') { acoes.edCancelar(); return true; }
  if (tela === 'musicas') { renderPastas(); return true; }
  if (tela === 'config' || tela === 'ajuda') { renderPastas(); return true; }
  return false;   // nas pastas: o VOLTAR do Android fecha o app
};

// Pré-visualização no PC: teclado faz o papel do pedal
if (!temAndroid) {
  document.addEventListener('keydown', function (e) {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    var d = e.key === 'PageDown' ? 1 : e.key === 'PageUp' ? -1 : 0;
    if (!d) { if (e.key === 'Escape') window.voltar(); return; }
    e.preventDefault();
    if (!e.repeat) MB.pedal('down', d);
  });
  document.addEventListener('keyup', function (e) {
    var d = e.key === 'PageDown' ? 1 : e.key === 'PageUp' ? -1 : 0;
    if (d) { e.preventDefault(); MB.pedal('up', d); }
  });
}

var modalCb = {};
function abrirModal(html) { modalEl.innerHTML = "<div class='janela'>" + html + "</div>"; modalEl.classList.add('aberto'); }
function fecharModal() { modalEl.classList.remove('aberto'); modalEl.innerHTML = ''; modalCb = {}; }
modalEl.addEventListener('click', function (e) { if (e.target === modalEl) fecharModal(); });
acoes.mFechar = function () { fecharModal(); };
acoes.mOp = function (v) { var f = modalCb['op' + v]; fecharModal(); if (f) f(); };
acoes.mOk = function () {
  var f = modalCb.ok, inp = document.getElementById('mCampo');
  var valor = inp ? inp.value.trim() : null;
  if (inp && !valor) { inp.focus(); return; }
  if (f && f(valor) === false) return;   // callback pediu para manter a janela
  if (modalCb.ok === f) fecharModal();
};
acoes.mTeclado = function () { var i = document.getElementById('mCampo'); if (i) i.focus(); B.teclado(); };

function modalMenu(titulo, ops) {
  var h = "<h3>" + esc(titulo) + "</h3><div class='lista'>";
  for (var i = 0; i < ops.length; i++) {
    modalCb['op' + i] = ops[i].f;
    h += "<div class='item" + (ops[i].perigo ? "' style='color:#ff7766" : "") + "' data-a='mOp' data-v='" + i + "'><span class='nome'>" + ops[i].t + "</span></div>";
  }
  h += "</div><div class='botoes'><button class='btn' data-a='mFechar'>VOLTAR</button></div>";
  abrirModal(h);
}
function modalTexto(titulo, rotulo, valor, cb) {
  modalCb.ok = cb;
  abrirModal("<h3>" + titulo + "</h3><p>" + rotulo + "</p><input class='campo' id='mCampo' value='" + esc(valor || '') + "'>" +
    "<div class='botoes'><button class='btn fraco' data-a='mFechar'>CANCELAR</button><button class='btn' data-a='mTeclado'>&#9000;</button><button class='btn ligado' data-a='mOk'>OK</button></div>");
  var inp = document.getElementById('mCampo');
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); acoes.mOk(); } });
  setTimeout(function () { inp.focus(); inp.select(); B.teclado(); }, 120);
}
function modalConfirmar(titulo, texto, rotuloOk, cb, perigo) {
  modalCb.ok = function () { fecharModal(); cb(); return false; };
  abrirModal("<h3>" + titulo + "</h3><p>" + texto + "</p><div class='botoes'><button class='btn fraco' data-a='mFechar'>CANCELAR</button>" +
    "<button class='btn" + (perigo ? " perigo" : " ligado") + "' data-a='mOk'>" + rotuloOk + "</button></div>");
}
function modalEscolherPasta(titulo, excluir, cb) {
  var ps = B.pastas().filter(function (p) { return p.nome !== excluir; });
  var ops = ps.map(function (p) { return { t: esc(nomePasta(p.nome)), f: function () { cb(p.nome); } }; });
  ops.push({ t: '+ NOVA PASTA', f: function () {
    modalTexto('NOVA PASTA', 'Nome da pasta:', '', function (n) {
      var r = B.novaPasta(n);
      if (!r.ok) { toast(r.erro || 'Erro ao criar pasta'); return false; }
      fecharModal(); cb(r.nome); return false;
    });
  } });
  modalMenu(titulo, ops);
}

// ── Importação: arquivos compartilhados de outro app ou escolhidos no seletor ──
var importAtual = null;
function mostrarImportacao() {
  var imp = B.importacao();
  if (!imp.itens || !imp.itens.length) {
    if (imp.rejeitados) toast(imp.rejeitados + ' arquivo(s) ignorado(s): não são texto');
    return;
  }
  importAtual = imp;
  var ps = B.pastas();
  var destino = pastaAtual && ps.some(function (p) { return p.nome === pastaAtual; }) ? pastaAtual : (ps.length ? ps[0].nome : '');
  // Veio de um .zip: sugere uma pasta com o nome do zip ("Anos 80.zip" → ANOS 80).
  // Se essa pasta já existir, só deixa ela marcada.
  var zipNome = imp.zip ? String(imp.zip) : '';
  var zipPasta = zipNome.replace(/[\\\/:*?"<>|.]/g, '').trim().replace(/\s+/g, '_').toUpperCase().replace(/^_+|_+$/g, '');
  var zipNova = false;
  if (zipPasta) {
    if (ps.some(function (p) { return p.nome === zipPasta; })) destino = zipPasta;
    else { destino = '__zip__'; zipNova = true; }
  }
  var h = "<h3>RECEBIDA(S) " + imp.itens.length + " M&Uacute;SICA(S)</h3>";
  if (imp.rejeitados) h += "<p>" + imp.rejeitados + " arquivo(s) ignorado(s): n&atilde;o s&atilde;o texto.</p>";
  if (imp.itens.length <= 10) {
    h += "<div class='lista' style='max-height:24vh'>";
    for (var i = 0; i < imp.itens.length; i++) {
      h += "<div style='padding:4px'><input class='campo imp-nome' data-i='" + i + "' value='" + esc(nomeMusica(imp.itens[i].nome)) + "'></div>";
    }
    h += "</div>";
  } else {
    // Pacote grande (.zip): lista só para conferir, com os nomes originais
    h += "<div class='lista' style='max-height:24vh;padding:6px 8px;color:#b8a83a;font-size:13px;line-height:1.6'>";
    for (var k = 0; k < imp.itens.length; k++) h += esc(nomeMusica(imp.itens[k].nome)) + "<br>";
    h += "</div>";
  }
  h += "<p>Salvar na pasta:</p><div class='lista' id='impPastas' style='max-height:22vh'>";
  if (zipNova) h += "<div class='item acao selected' data-a='impPasta' data-v='__zip__'><span class='nome'>&#9733; NOVA PASTA: " + esc(nomePasta(zipPasta)) + "</span></div>";
  for (var j = 0; j < ps.length; j++) {
    var s = ps[j].nome === destino;
    h += "<div class='item" + (s ? " selected" : "") + "' data-a='impPasta' data-v='" + esc(ps[j].nome) + "'><span class='nome'>" + esc(nomePasta(ps[j].nome)) + "</span></div>";
  }
  h += "<div class='item acao' data-a='impNovaPasta'><span class='nome'>+ NOVA PASTA</span></div></div>";
  h += "<label class='marca'><input type='checkbox' id='impSubst' checked> Substituir m&uacute;sicas com o mesmo nome</label>";
  h += "<div class='botoes'><button class='btn fraco' data-a='impCancelar'>CANCELAR</button><button class='btn ligado' data-a='impOk'>&#10003; IMPORTAR</button></div>";
  abrirModal(h);
  importAtual.destino = destino;
}
acoes.impPasta = function (v, el) {
  importAtual.destino = v;
  var itens = document.querySelectorAll('#impPastas .item');
  for (var i = 0; i < itens.length; i++) itens[i].classList.toggle('selected', itens[i] === el);
};
acoes.impNovaPasta = function () {
  var nomes = lerNomesImport();
  var subst = document.getElementById('impSubst').checked;
  modalTexto('NOVA PASTA', 'Nome da pasta:', '', function (n) {
    var r = B.novaPasta(n);
    if (!r.ok) { toast(r.erro || 'Erro ao criar pasta'); return false; }
    pastaAtual = r.nome;
    mostrarImportacao();
    var campos = document.querySelectorAll('.imp-nome');
    for (var i = 0; i < campos.length && i < nomes.length; i++) campos[i].value = nomes[i];
    document.getElementById('impSubst').checked = subst;
    return false;
  });
};
function lerNomesImport() {
  var campos = document.querySelectorAll('.imp-nome'), out = [];
  for (var i = 0; i < campos.length; i++) out.push(campos[i].value.trim() || ('Musica ' + (i + 1)));
  return out;
}
acoes.impOk = function () {
  if (!importAtual.destino) { toast('Crie uma pasta primeiro'); return; }
  if (importAtual.destino === '__zip__') {
    var rp = B.novaPasta(importAtual.zip);
    if (!rp.nome) { toast(rp.erro || 'Erro ao criar pasta'); return; }
    importAtual.destino = rp.nome;   // criada agora (ou já existia com esse nome)
  }
  var r = B.concluirImportacao(importAtual.destino, lerNomesImport(), document.getElementById('impSubst').checked);
  fecharModal();
  if (!r.ok) { toast(r.erro || 'Erro ao importar'); return; }
  pastaAtual = importAtual.destino; idxMusica = -1;
  toast(r.qtd + ' música(s) importada(s) em ' + nomePasta(pastaAtual));
  renderMusicas();
};
acoes.impCancelar = function () { B.descartarImportacao(); fecharModal(); };

if (ehPC && window.Android && typeof window.Android.receberArquivo === 'function') {
  var arrastando = 0;
  window.addEventListener('dragenter', function (e) { e.preventDefault(); arrastando++; document.body.classList.add('soltando'); });
  window.addEventListener('dragleave', function (e) { e.preventDefault(); if (--arrastando <= 0) { arrastando = 0; document.body.classList.remove('soltando'); } });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); arrastando = 0; document.body.classList.remove('soltando');
    var fs = e.dataTransfer && e.dataTransfer.files ? Array.prototype.slice.call(e.dataTransfer.files) : [];
    if (!fs.length) return;
    var falta = fs.length;
    fs.forEach(function (f) {
      var r = new FileReader();
      r.onload = function () { try { window.Android.receberArquivo(f.name, new Uint8Array(r.result)); } catch (x) {} if (--falta === 0) mostrarImportacao(); };
      r.onerror = function () { if (--falta === 0) mostrarImportacao(); };
      r.readAsArrayBuffer(f);
    });
  });
}
