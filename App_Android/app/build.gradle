plugins {
    id 'com.android.application'
}

android {
    // ATENÇÃO: o applicationId é a "identidade" do app no Android e no registro
    // de desenvolvedor do Google. Troque ANTES de vender a primeira unidade —
    // depois disso, mudar significa outro app (o comprador perderia as músicas).
    namespace 'br.com.musicbox.teleprompter'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.musicbox.teleprompter'
        minSdk 24          // Android 7.0 ou mais novo
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Sem dependências: só o Android puro. Assim o APK fica com poucas centenas de KB
// e cabe com folga na memória do pedal ESP32-S3.
